<!DOCTYPE html>
<html lang="en">
<head>
<script>
  (function () {
    var t = localStorage.getItem('theme');
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Katie Dubois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" href="img/favicon-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="img/favicon-dark.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header id="siteHeader">
  <div class="header-inner">
    <a href="/" class="logo">
      <div class="avatar"><img class="logo-light" src="/img/logo-black.png" alt="Katie Dubois logo"><img class="logo-dark" src="/img/logo-white.png" alt="Katie Dubois logo"></div>
      <div class="name">Katie Dubois</div>
    </a>
    <div class="header-right">
      <nav class="header-nav" aria-label="Primary">
        <ul>
          <li><a href="/work" class="link-hover">Work</a></li>
          <li><a href="/about" class="link-hover">About</a></li>
          <li><a href="/contact" class="active link-hover">Contact</a></li>
        </ul>
      </nav>
      <a href="/resume.pdf" class="resume-pill" target="_blank" rel="noopener">Résumé</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="page">

  <div class="page-title reveal">
    <h1>Contact</h1>
    <p>Open to new projects, collaborations, and good ideas.</p>
  </div>

  <div class="section reveal">
    <form class="contact-box" id="contactForm">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="title">Subject</label>
        <select id="title" name="title" required>
          <option value="" disabled selected>Select a subject</option>
          <option value="Job Opportunity">Job Opportunity</option>
          <option value="Collaboration">Collaboration</option>
          <option value="General Inquiry">General Inquiry</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="What are you working on?" required></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Send message</button>
      <p class="form-status" id="formStatus" style="display:none;"></p>
    </form>

    <div class="contact-direct">
      <span>Prefer email?</span>
      <a class="link-hover js-copy-email" href="#" data-email="katiedubois@hotmail.com">katiedubois@hotmail.com</a>
    </div>
  </div>

  <footer class="site-footer reveal">
    <span>© 2026 Katie Dubois. All rights reserved.</span>
  </footer>

</div>

<button class="to-top" id="toTop" aria-label="Scroll to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  const siteHeader = document.getElementById('siteHeader');
  window.addEventListener('scroll', () => {
    siteHeader.classList.toggle('scrolled', window.scrollY > 8);
  });

  const copyEmail = async (email) => {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(email);
      return;
    }
    const input = document.createElement('textarea');
    input.value = email;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
  };

  const toast = document.createElement('div');
  toast.className = 'copy-toast';
  toast.setAttribute('aria-live', 'polite');
  toast.textContent = 'Copied';
  document.body.appendChild(toast);

  let toastTimer = null;
  const showToast = () => {
    toast.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 1400);
  };

  document.querySelectorAll('.js-copy-email').forEach((el) => {
    el.addEventListener('click', async (event) => {
      event.preventDefault();
      const email = el.dataset.email;
      if (!email) return;
      try {
        await copyEmail(email);
        showToast();
      } catch (error) {
        console.error('Copy failed', error);
      }
    });
  });

  // Contact form — powered by EmailJS
  const EMAILJS_SERVICE_ID = "service_ogdnd0l";
  const EMAILJS_TEMPLATE_ID = "template_d36iv9f";
  const EMAILJS_PUBLIC_KEY = "25YdxDxuflxkB9nIa";

  const contactForm = document.getElementById('contactForm');
  const submitBtn = document.getElementById('submitBtn');
  const formStatus = document.getElementById('formStatus');

  const showStatus = (message, type) => {
    formStatus.textContent = message;
    formStatus.className = `form-status ${type}`;
    formStatus.style.display = 'block';
  };

  contactForm.addEventListener('submit', (event) => {
    event.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';
    formStatus.style.display = 'none';

    emailjs
      .sendForm(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, contactForm, EMAILJS_PUBLIC_KEY)
      .then(() => {
        submitBtn.textContent = 'Send message';
        submitBtn.disabled = false;
        contactForm.reset();
        showStatus('Message sent successfully!', 'success');
        setTimeout(() => { formStatus.style.display = 'none'; }, 4000);
      })
      .catch((error) => {
        console.error('EmailJS error', error);
        submitBtn.textContent = 'Send message';
        submitBtn.disabled = false;
        showStatus('Something went wrong. Please try again.', 'error');
        setTimeout(() => { formStatus.style.display = 'none'; }, 4000);
      });
  });

  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  revealEls.forEach(el => io.observe(el));

  const toTopBtn = document.getElementById('toTop');
  window.addEventListener('scroll', () => {
    toTopBtn.classList.toggle('visible', window.scrollY > 480);
  });
  toTopBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>

</body>
</html>
